name: test

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Run PHPStan
        run: ./vendor/bin/phpstan

  ecs:
    name: ECS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Run ECS
        run: ./vendor/bin/ecs check
